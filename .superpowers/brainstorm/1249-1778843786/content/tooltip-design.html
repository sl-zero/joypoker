<h2>术语提示 Tooltip — 问号位置与样式</h2>
<p class="subtitle">编辑器中每个游戏术语旁放一个 "?" 图标，鼠标悬浮时显示说明</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>问号紧贴术语</h3>
      <p>"?" 放在术语文字后面紧挨着，说明浮层从问号上方弹出</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>问号在标签末尾</h3>
      <p>"?" 放在整行标签最后面，说明浮层左对齐弹出</p>
    </div>
  </div>
</div>

<h3 style="margin-top:2rem;">预览（模拟当前编辑器深色风格）</h3>

<div class="mockup">
  <div class="mockup-body">
    <div style="background:#0f1117;color:#e4e4e7;padding:24px;border-radius:12px;font-size:14px;max-width:560px;margin:0 auto;font-family:system-ui,sans-serif;">

      <p style="color:#a1a1aa;font-size:12px;margin-bottom:8px;">方案 A — 问号紧贴术语文字</p>
      <div style="margin-bottom:20px;display:flex;flex-direction:column;gap:3px;">
        <span style="display:inline-flex;align-items:center;gap:4px;">
          庄家软 17 要牌（H17）
          <span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid #71717a;color:#a1a1aa;font-size:11px;font-weight:bold;cursor:help;">
            ?
          </span>
        </span>
        <div style="margin-left:0;">
          <input type="checkbox" checked style="accent-color:#6366f1;"/>
          <span style="color:#d4d4d8;margin-left:6px;">H17 要牌</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <label style="display:flex;align-items:center;font-size:13px;gap:4px;">
          <span>允许 Straddle</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid #71717a;color:#a1a1aa;font-size:10px;font-weight:bold;cursor:help;">?</span>
          <input type="checkbox" style="margin-left:auto;accent-color:#6366f1;"/>
        </label>

        <p style="color:#a1a1aa;font-size:12px;margin-top:12px;margin-bottom:0;">方案 B — 问号在标签末尾（checkbox 右侧）</p>
        <label style="display:flex;align-items:center;font-size:13px;">
          <span>允许 Run it twice</span>
          <input type="checkbox" style="margin-left:auto;margin-right:0;accent-color:#6366f1;"/>
          <span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid #71717a;color:#a1a1aa;font-size:10px;font-weight:bold;cursor:help;margin-left:6px;">?</span>
        </label>

        <label style="display:flex;align-items:center;font-size:13px;margin-top:4px;">
          <span>分牌后允许加倍</span>
          <input type="checkbox" style="margin-left:auto;margin-right:0;accent-color:#6366f1;"/>
          <span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid #71717a;color:#a1a1aa;font-size:10px;font-weight:bold;cursor:help;margin-left:6px;">?</span>
        </label>
      </div>

    </div>
  </div>
</div>
